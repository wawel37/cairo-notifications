name: Cairo Tag Monitor

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

jobs:
  check-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current Cairo tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/starkware-libs/cairo/tags?per_page=30" \
            | python3 -c "import sys,json; print('\n'.join(t['name'] for t in json.load(sys.stdin)))" \
            | sort -u > fetched_tags.txt

      - name: Determine new tags
        id: diff
        run: |
          touch known_cairo_tags.txt
          comm -23 fetched_tags.txt <(sort -u known_cairo_tags.txt) > new_tags.txt
          if [ -s new_tags.txt ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack for each new tag
        if: steps.diff.outputs.has_new == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"$TAG\"}"
          done < new_tags.txt

      - name: Update known tags
        if: steps.diff.outputs.has_new == 'true'
        run: |
          sort -u fetched_tags.txt known_cairo_tags.txt -o known_cairo_tags.txt
          rm -f fetched_tags.txt new_tags.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add known_cairo_tags.txt
          git commit -m "chore: update known Cairo tags"
          git push
